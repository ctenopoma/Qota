[package]
name = "qota"
version = "0.1.0"
description = "Qota — local task manager"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "qota"
path = "src/main.rs"

[dependencies]
# 既定の femtovg (OpenGL) は常駐メモリが増えるので外し、ソフトウェアレンダラだけにする
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
parking_lot = "0.12"
rfd = "0.17"
dirs = "6"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
# 起動時に画面の作業領域と拡大率を読むため（winit 経由では作業領域が取れない）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
